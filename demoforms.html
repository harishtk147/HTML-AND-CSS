<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<form action="signupresult.html" method="get" enctype="multipart/form-data">

    <div>
        <label for="username">User name:</label>
        <input type="text" name="username" id="username" placeholder="username" required>
    </div>

    <div>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="password" required minlength="8">
    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="email" required>
    </div>
    <div>
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" placeholder="age" min="18" max="50" step="2">
    </div>

    <div>
    <label for="about">About</label>
    <textarea name="about" id="about" cols="20" rows="5"></textarea>
    </div>

    <div>
        <input type="checkbox" name="smsalert" id="smsalert">
        <label for="smsalert">SMS Alert</label>
    </div>

    <div>
        <input type="checkbox" name="emailalert" id="emailalert">
        <label for="emailalert">Email Alert</label>
    </div>

    <div>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
    </div>

    <div>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
    </div>
    <div>
        <select name="state" id="state" >
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="AP" label="AP"></option>
            <option value="Kerala">Kerala</option>
        </select>
    </div>

    <div>
        <label for="file">Resume</label>
        <input type="file" id="file" name="file">
    </div>
   

    <button type="submit">Sign Up</button>
    <button type="reset">Reset</button>

</form>

</body>
</html>
